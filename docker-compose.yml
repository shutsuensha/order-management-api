services:
  postgres:
    image: postgres:16
    container_name: drf-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "1112:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: drf-redis
    restart: unless-stopped
    ports:
      - "3443:6379"

volumes:
  postgres_data: